# Builds the iOS app on a GitHub-hosted Mac and publishes an UNSIGNED .ipa as an artifact.
# Install it on your iPhone from Windows with Sideloadly or AltStore (they sign it with your Apple ID).
# Free for public repositories.
name: iOS build

on:
  push:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned, device)
        working-directory: ios
        run: |
          xcodebuild -project SLock.xcodeproj -scheme SLock -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SLock.app Payload/
          zip -qr SLock-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SLock-unsigned-ipa
          path: ios/SLock-unsigned.ipa
          retention-days: 30
