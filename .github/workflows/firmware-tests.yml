# Runs the firmware core's host tests (door estimator, side tracking, unlock rules, scenarios) on
# Linux, and checks that the XIAO nRF52840 firmware still compiles. Free for public repositories.
name: Firmware tests

on:
  push:
    paths: ["firmware/**", "twin/**", ".github/workflows/firmware-tests.yml"]
  pull_request:
    paths: ["firmware/**", "twin/**"]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        # Compile errors and failing checks are also raised as annotations, which are readable
        # without signing in to GitHub (plain logs are not).
        run: |
          set +e
          bash firmware/run_tests.sh > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          # One annotation holding every line (GitHub shows at most 10 annotations per step).
          msg=$(grep -E "error:|FAIL|tests, " test-output.txt | head -80 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$msg" ] && echo "::error title=Host tests::$msg"
          exit $status

  board-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build XIAO nRF52840 firmware
        working-directory: firmware
        run: pio run

  twin:
    # The digital twin's library, protocol check (a virtual iPhone v0.3) and scenario buttons,
    # headless on Linux. On the dev PC, Smart App Control blocks freshly built libraries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the twin library
        run: bash twin/build.sh
      - name: Install Python dependencies
        run: pip install cryptography
      - name: Protocol check and scenarios
        run: |
          set +e
          python twin/test_protocol.py > twin-output.txt 2>&1
          a=$?
          timeout 900 python twin/test_scenarios.py >> twin-output.txt 2>&1
          b=$?
          cat twin-output.txt
          msg=$(grep -E "FAIL|error|Error|Traceback|passed" twin-output.txt | head -80 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          level=error; [ $a -eq 0 ] && [ $b -eq 0 ] && level=notice
          [ -n "$msg" ] && echo "::$level title=Twin tests::$msg"
          [ $a -eq 0 ] && [ $b -eq 0 ]
