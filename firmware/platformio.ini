; SLock firmware for the Seeed XIAO nRF52840 Sense.
;
; The portable core in lib/slock_core is also tested on the PC with run_tests.ps1.
;
; The XIAO nRF52840 isn't in PlatformIO's official nordicnrf52 platform. This community fork adds
; it in two variants: "xiaoblesense" (Seeed's mbed core) and "xiaoblesense_adafruit"
; (Adafruit nRF52 core). We use the Adafruit one: Bluefruit BLE with bonding, InternalFS for
; flash storage, and mature low-power support.

[platformio]
default_envs = xiao_ble_sense

[env:xiao_ble_sense]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoblesense_adafruit
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    adafruit/Adafruit INA219
monitor_speed = 115200
