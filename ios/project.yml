# XcodeGen spec: `xcodegen generate` (on a Mac or in CI) creates SLock.xcodeproj and SLock/Info.plist.
# Neither generated file is committed; this file is the source of truth.
name: SLock
options:
  bundleIdPrefix: dev.slock
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SLock:
    type: application
    platform: iOS
    sources: [SLock]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.slock.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: SLock/Info.plist
      properties:
        CFBundleDisplayName: SLock
        NSBluetoothAlwaysUsageDescription: SLock uses Bluetooth to talk to your door lock and unlock it as you arrive.
        NSLocationWhenInUseUsageDescription: SLock uses your home location to tell your lock when you have genuinely arrived home.
        NSLocationAlwaysAndWhenInUseUsageDescription: SLock notices when you arrive home, even when the app is closed, so your lock knows a nearby phone really just came home and isn't being relayed.
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
